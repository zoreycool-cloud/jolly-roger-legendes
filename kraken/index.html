<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>L’Encre du Kraken — Jolly Roger</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16.png?v=1">
<link rel="shortcut icon" href="../assets/favicon/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body>
<main class="legend-page"
      style="--accent:#002496;
             --top-art:url('../assets/visuals/kraken-top.jpg');
             --bottom-art:url('../assets/visuals/kraken-bottom.jpg')">

  <div class="mandala-zone top" aria-hidden="true">
    <div class="mandala-art"></div>
  </div>

  <section class="content-zone">
    <p class="kicker">ÉCOUTER LA LÉGENDE DE</p>
    <h1 class="legend-title">L’ENCRE DU KRAKEN</h1>
    <div class="accent-rule"></div>

    <div class="player">
      <button class="play-button" data-playing="false" aria-label="Lire">
        <span class="play-icon" aria-hidden="true"></span>
      </button>
      <span class="time current">00:00</span>
      <input class="seek" type="range" min="0" value="0" step="0.1" aria-label="Position de lecture">
      <span class="time duration">00:00</span>
    </div>

    <audio preload="metadata" src="../audio/kraken.mp3"></audio>

    <p class="official">Version audio officielle du jeu Jolly Roger</p>

    <div class="credits">
      <p>VOIX. <strong>SAMOO</strong></p>
      <p>AUTEUR. <strong>ZOREY COOL</strong></p>
      <p>ENREGISTREMENT/MIXAGE. <strong>M.2.O.</strong></p>
    </div>

    <a class="menu-link" href="../legendes/">Menu des légendes</a>
  </section>

  <div class="mandala-zone bottom" aria-hidden="true">
    <div class="mandala-art"></div>
  </div>

</main>
<script src="../assets/player.js"></script>
<script src="../assets/menu.js?v=6"></script>
</body>
</html>
